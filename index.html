<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Controle de Produção</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
body {
  margin: 0;
  font-family: "Segoe UI";
  background: #f4f6f8;
}

/* LOGIN */
#login {
  display: flex;
  height: 100vh;
  justify-content: center;
  align-items: center;
}

.card {
  background: white;
  padding: 35px;
  border-radius: 10px;
  width: 320px;
  box-shadow: 0 5px 20px rgba(0,0,0,0.1);
  text-align: center;
}

.logo {
  width: 80px;
  margin-bottom: 15px;
}

input {
  width: 100%;
  padding: 12px;
  margin-top: 10px;
}

button {
  width: 100%;
  padding: 12px;
  margin-top: 15px;
  background: #076091;
  color: white;
  border: none;
}

.erro {
  color: red;
  margin-top: 10px;
}

/* APP */
#app {
  display: none;
}

header {
  background: #076091;
  color: white;
  padding: 15px;
  display: flex;
  justify-content: space-between;
}

iframe {
  width: 100%;
  height: 90vh;
  border: none;
}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="login">
  <div class="card">
    <img src="logo.png" class="logo">
    <h2>Controle de Produção</h2>

    <input type="text" id="usuario" placeholder="Usuário">
    <input type="password" id="senha" placeholder="Senha">

    <button onclick="entrar()">Entrar</button>

    <div id="erro" class="erro"></div>
  </div>
</div>

<!-- SISTEMA -->
<div id="app">
  <header>
    <div>Produção</div>
    <button onclick="sair()">Sair</button>
  </header>

  <iframe src="http://192.168.62.203/index.php?C_Sr/dashboard_teares_diario/3"></iframe>
</div>

<script>
const SUPABASE_URL = "https://jfxdoccoroctgssybydd.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpmeGRvY2Nvcm9jdGdzc3lieWRkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzUxNDg1MjksImV4cCI6MjA5MDcyNDUyOX0.v3bMqIojI0sKujWl40CATlr_VDhrkkYX4ZOKTu-hdmo";

const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

/* LOGIN COM USUÁRIO */
async function entrar() {
  const usuario = document.getElementById("usuario").value;
  const senha = document.getElementById("senha").value;
  const erro = document.getElementById("erro");

  erro.innerText = "";

  // 🔎 Buscar email pelo usuário
  const { data, error } = await supabaseClient
    .from("usuarios")
    .select("email")
    .eq("usuario", usuario)
    .single();

  if (error || !data) {
    erro.innerText = "Usuário não encontrado";
    return;
  }

  // 🔐 Login com email (oculto)
  const { error: loginError } = await supabaseClient.auth.signInWithPassword({
    email: data.email,
    password: senha
  });

  if (loginError) {
    erro.innerText = "Senha incorreta";
  } else {
    carregarSessao();
  }
}

/* LOGOUT */
async function sair() {
  await supabaseClient.auth.signOut();
  location.reload();
}

/* SESSÃO */
async function carregarSessao() {
  const { data } = await supabaseClient.auth.getSession();

  if (data.session) {
    document.getElementById("login").style.display = "none";
    document.getElementById("app").style.display = "block";
  }
}

/* INIT */
carregarSessao();

const API = "https://script.google.com/macros/s/AKfycbzgjRKkKyWhUx060loEjkuEFJlS9wMtALaV9lwiN0EXiIs7JbMdosVE7jB7sCE0sGRLfg/exec";

let dados = [];
let maquinaAtual = null;

/* TROCAR TELA */
function tela(id) {
  document.querySelectorAll(".screen").forEach(s => s.classList.remove("active"));
  document.getElementById(id).classList.add("active");
}

/* CARREGAR MÁQUINAS */
async function carregar() {
  const res = await fetch(API);
  dados = await res.json();

  const div = document.getElementById("listaMaquinas");
  div.innerHTML = "";

  dados.forEach(d => {
    const el = document.createElement("div");
    el.className = "maquina";
    el.innerText = d.maquina;
    el.onclick = () => acessar(d);
    div.appendChild(el);
  });
}

/* ACESSAR MÁQUINA */
function acessar(d) {
  maquinaAtual = d;

  tela("loading");
  document.getElementById("textoLoading").innerText =
    "Acessando produção do tear " + d.maquina;

  setTimeout(() => {
    mostrarDados();
    tela("producao");
  }, 3000);
}

/* MOSTRAR DADOS */
function mostrarDados() {
  document.getElementById("titulo").innerText =
    "Tear " + maquinaAtual.maquina;

  let html = `
    <b>Atual:</b><br>
    ${maquinaAtual.atual1 || "-"} | ${maquinaAtual.atual2 || "-"}<br><br>
  `;

  maquinaAtual.proximos.forEach((p, i) => {
    html += `Próximo ${i+1}: ${p[0]} | ${p[1]}<br>`;
  });

  document.getElementById("dados").innerHTML = html;
}

/* FINALIZAR */
async function finalizar() {
  tela("loading");
  document.getElementById("textoLoading").innerText =
    "Aguarde, atualizando...";

  const res = await fetch(API + "?linha=" + maquinaAtual.linha);
  const txt = await res.text();

  tela("producao");

  const fb = document.getElementById("feedback");
  fb.style.display = "block";

  if (txt === "OK") {
    fb.className = "feedback sucesso";
    fb.innerText = "Produção atualizada com sucesso!";
  } else {
    fb.className = "feedback erro";
    fb.innerText = "Erro ao atualizar!";
  }

  // voltar pro painel depois
  setTimeout(() => {
    fb.style.display = "none";
    tela("painel");
    carregar();
  }, 2500);
}

/* INIT */
carregar();
</script>

</body>
</html>
