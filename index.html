<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Controle de Produção</title>

<style>
:root {
  --cor: #076091;
  --cor2: #0a7bb8;
  --branco: #ffffff;
}

body {
  margin: 0;
  font-family: 'Segoe UI', sans-serif;
  background: linear-gradient(135deg, #076091, #0a7bb8);
  color: white;
}

header {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 15px;
  padding: 20px;
}

header img {
  width: 60px;
}

.container {
  max-width: 800px;
  margin: auto;
  padding: 20px;
}

.card {
  background: rgba(255,255,255,0.1);
  border-radius: 20px;
  padding: 25px;
  backdrop-filter: blur(10px);
  margin-top: 20px;
}

select, button {
  width: 100%;
  padding: 12px;
  border-radius: 10px;
  border: none;
  margin-top: 10px;
  font-size: 16px;
}

button {
  background: white;
  color: #076091;
  font-weight: bold;
  cursor: pointer;
}

button:hover {
  opacity: 0.9;
}

.status {
  margin-top: 15px;
}

.titulo {
  font-weight: bold;
  margin-top: 10px;
}
</style>
</head>

<body>

<header>
  <img src="logo.png">
  <h2>Controle de Produção</h2>
</header>

<div class="container">

  <button onclick="abrirPlanilha()">📄 Ver Planilha</button>

  <div class="card">
    <h3>Selecionar Máquina</h3>

    <select id="maquinaSelect"></select>

    <div id="info" class="status"></div>

    <button onclick="finalizar()">✅ Finalizar Produção</button>
  </div>

</div>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbwX_lYZGNphFRb9wllLDcaX5T-pgqyVjCPg5irdStsRezonNTJbbQLFPSDOe2-C_tWMCA/exec";
const PLANILHA_URL = "https://docs.google.com/spreadsheets/d/1C2kpN4iAKKIUg0_1oVAsmMRWFSHg4-6t6DdHm1OrDoM/edit?usp=sharing";

let dados = [];

function abrirPlanilha() {
  window.open(PLANILHA_URL, "_blank");
}

async function carregarDados() {
  const res = await fetch(API_URL);
  dados = await res.json();

  const select = document.getElementById("maquinaSelect");
  select.innerHTML = "";

  dados.forEach(item => {
    const option = document.createElement("option");
    option.value = item.linha;
    option.textContent = "Tear " + item.maquina;
    select.appendChild(option);
  });

  mostrarInfo();
}

function mostrarInfo() {
  const linha = document.getElementById("maquinaSelect").value;
  const item = dados.find(d => d.linha == linha);

  if (!item) return;

  let html = `
    <p class="titulo">Atual:</p>
    <p>${item.atual[0] || "-"} | ${item.atual[1] || "-"}</p>
  `;

  if (item.proximos.length > 0) {
    html += `<p class="titulo">Próximos:</p>`;
    item.proximos.forEach((p, i) => {
      html += `<p>${i + 1}º → ${p[0]} | ${p[1]}</p>`;
    });
  } else {
    html += `<p>Sem próximas produções</p>`;
  }

  document.getElementById("info").innerHTML = html;
}

async function finalizar() {
  const linha = document.getElementById("maquinaSelect").value;

  const res = await fetch(`${API_URL}?linha=${linha}`);
  const resposta = await res.text();

  if (resposta === "SEM_PROXIMO") {
    alert("Não há próxima produção!");
    return;
  }

  alert("Produção atualizada!");
  carregarDados();
}

document.getElementById("maquinaSelect").addEventListener("change", mostrarInfo);

carregarDados();
</script>

</body>
</html>
