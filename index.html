<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel de Produção</title>

<style>
body {
  margin: 0;
  font-family: "Segoe UI", Arial;
  background: #f4f6f8;
  color: #333;
}

/* HEADER */
header {
  height: 70px;
  background: #076091;
  display: flex;
  align-items: center;
  padding: 0 20px;
  color: white;
}

header img {
  height: 40px;
  margin-right: 15px;
}

/* TELAS */
.screen {
  display: none;
}

.active {
  display: block;
}

/* PAINEL */
#painel iframe {
  width: 100%;
  height: 80vh;
  border: none;
}

.maquinas {
  display: flex;
  flex-wrap: wrap;
  padding: 20px;
  gap: 10px;
  justify-content: center;
}

.maquina {
  background: white;
  border: 2px solid #076091;
  padding: 15px 20px;
  border-radius: 8px;
  cursor: pointer;
  font-weight: bold;
  transition: 0.2s;
}

.maquina:hover {
  background: #076091;
  color: white;
}

/* LOADING */
.loading {
  height: 80vh;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  font-size: 20px;
}

.spinner {
  border: 5px solid #ccc;
  border-top: 5px solid #076091;
  border-radius: 50%;
  width: 50px;
  height: 50px;
  animation: girar 1s linear infinite;
  margin-bottom: 20px;
}

@keyframes girar {
  100% { transform: rotate(360deg); }
}

/* PRODUÇÃO */
.container {
  max-width: 700px;
  margin: 40px auto;
  background: white;
  padding: 25px;
  border-radius: 10px;
  box-shadow: 0 5px 15px rgba(0,0,0,0.1);
}

h2 {
  margin-top: 0;
}

.info {
  margin: 15px 0;
}

button {
  width: 100%;
  padding: 14px;
  border: none;
  background: #076091;
  color: white;
  font-size: 16px;
  border-radius: 8px;
  cursor: pointer;
}

button:hover {
  background: #054d73;
}

/* FEEDBACK */
.feedback {
  margin-top: 15px;
  padding: 12px;
  border-radius: 6px;
  display: none;
}

.sucesso {
  background: #d4edda;
  color: #155724;
}

.erro {
  background: #f8d7da;
  color: #721c24;
}
</style>
</head>

<body>

<header>
  <img src="logo.png">
  <h3>Controle de Produção</h3>
</header>

<!-- 🔄 LOADING -->
<div id="loading" class="screen">
  <div class="loading">
    <div class="spinner"></div>
    <div id="textoLoading">Carregando...</div>
  </div>
</div>

<!-- ⚙️ PRODUÇÃO -->
<div id="producao" class="screen">
  <div class="container">
    <h2 id="titulo"></h2>

    <div class="info" id="dados"></div>

    <button onclick="finalizar()">Finalizar Produção Atual</button>

    <div id="feedback" class="feedback"></div>
  </div>
</div>

<script>
const API = "https://script.google.com/macros/s/AKfycbzgjRKkKyWhUx060loEjkuEFJlS9wMtALaV9lwiN0EXiIs7JbMdosVE7jB7sCE0sGRLfg/exec";

let dados = [];
let maquinaAtual = null;

/* TROCAR TELA */
function tela(id) {
  document.querySelectorAll(".screen").forEach(s => s.classList.remove("active"));
  document.getElementById(id).classList.add("active");
}

/* CARREGAR MÁQUINAS */
async function carregar() {
  const res = await fetch(API);
  dados = await res.json();

  const div = document.getElementById("listaMaquinas");
  div.innerHTML = "";

  dados.forEach(d => {
    const el = document.createElement("div");
    el.className = "maquina";
    el.innerText = d.maquina;
    el.onclick = () => acessar(d);
    div.appendChild(el);
  });
}

/* ACESSAR MÁQUINA */
function acessar(d) {
  maquinaAtual = d;

  tela("loading");
  document.getElementById("textoLoading").innerText =
    "Acessando produção do tear " + d.maquina;

  setTimeout(() => {
    mostrarDados();
    tela("producao");
  }, 3000);
}

/* MOSTRAR DADOS */
function mostrarDados() {
  document.getElementById("titulo").innerText =
    "Tear " + maquinaAtual.maquina;

  let html = `
    <b>Atual:</b><br>
    ${maquinaAtual.atual1 || "-"} | ${maquinaAtual.atual2 || "-"}<br><br>
  `;

  maquinaAtual.proximos.forEach((p, i) => {
    html += `Próximo ${i+1}: ${p[0]} | ${p[1]}<br>`;
  });

  document.getElementById("dados").innerHTML = html;
}

/* FINALIZAR */
async function finalizar() {
  tela("loading");
  document.getElementById("textoLoading").innerText =
    "Aguarde, atualizando...";

  const res = await fetch(API + "?linha=" + maquinaAtual.linha);
  const txt = await res.text();

  tela("producao");

  const fb = document.getElementById("feedback");
  fb.style.display = "block";

  if (txt === "OK") {
    fb.className = "feedback sucesso";
    fb.innerText = "Produção atualizada com sucesso!";
  } else {
    fb.className = "feedback erro";
    fb.innerText = "Erro ao atualizar!";
  }

  // voltar pro painel depois
  setTimeout(() => {
    fb.style.display = "none";
    tela("painel");
    carregar();
  }, 2500);
}

/* INIT */
carregar();
</script>

</body>
</html>
