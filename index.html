<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Controle de Produção</title>

<style>
body {
  margin: 0;
  font-family: Arial;
  background: linear-gradient(135deg, #076091, #0a7bb8);
  color: white;
}

header {
  text-align: center;
  padding: 20px;
}

header img {
  width: 70px;
}

.container {
  max-width: 600px;
  margin: auto;
  padding: 20px;
}

.card {
  background: rgba(255,255,255,0.1);
  padding: 20px;
  border-radius: 15px;
}

select, button {
  width: 100%;
  padding: 12px;
  margin-top: 10px;
  border-radius: 10px;
  border: none;
}

button {
  background: white;
  color: #076091;
  font-weight: bold;
}

.info {
  margin-top: 15px;
}
</style>
</head>

<body>

<header>
  <img src="logo.png">
  <h2>Controle de Produção</h2>
</header>

<div class="container">
  
  <div class="card">
    <select id="maquina"></select>

    <div id="info" class="info"></div>

    <button onclick="finalizar()">Finalizar Produção</button>

    <button href="https://docs.google.com/spreadsheets/d/1C2kpN4iAKKIUg0_1oVAsmMRWFSHg4-6t6DdHm1OrDoM/edit?usp=sharing">Acessar planilha</button>
  </div>

</div>

<script>
const API = "https://script.google.com/macros/s/AKfycbzgjRKkKyWhUx060loEjkuEFJlS9wMtALaV9lwiN0EXiIs7JbMdosVE7jB7sCE0sGRLfg/exec";

let dados = [];

async function carregar() {
  const res = await fetch(API);
  dados = await res.json();

  const select = document.getElementById("maquina");
  select.innerHTML = "";

  dados.forEach(d => {
    const op = document.createElement("option");
    op.value = d.linha;
    op.textContent = "Tear " + d.maquina;
    select.appendChild(op);
  });

  mostrar();
}

function mostrar() {
  const linha = document.getElementById("maquina").value;
  const item = dados.find(d => d.linha == linha);

  if (!item) return;

  let html = `
    <p><b>Atual:</b> ${item.atual1 || "-"} | ${item.atual2 || "-"}</p>
  `;

  if (item.proximos.length > 0) {
    item.proximos.forEach((p, i) => {
      html += `<p>Próx ${i+1}: ${p[0]} | ${p[1]}</p>`;
    });
  } else {
    html += `<p>Sem próximos</p>`;
  }

  document.getElementById("info").innerHTML = html;
}

async function finalizar() {
  const linha = document.getElementById("maquina").value;

  const res = await fetch(API + "?linha=" + linha);
  const txt = await res.text();

  if (txt === "SEM_PROXIMO") {
    alert("Sem próxima produção");
    return;
  }

  alert("Atualizado!");
  carregar();
}

document.getElementById("maquina").addEventListener("change", mostrar);

carregar();
</script>

</body>
</html>
